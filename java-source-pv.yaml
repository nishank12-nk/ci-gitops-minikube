apiVersion: v1
kind: PersistentVolume
metadata:
  name: java-source-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  hostPath:
    path: /mnt/source
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: java-source-pvc
  namespace: ci-gitops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
  volumeName: java-source-pv
