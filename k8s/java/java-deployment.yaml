apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: ci-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
    spec:
      containers:
        - name: java-backend
          image: registry.kube-system.svc.cluster.local/java-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
